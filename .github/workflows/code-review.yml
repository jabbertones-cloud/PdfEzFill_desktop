# OpenCodeReview PR review.
#
# Adapted from the canonical example at
# alibaba/open-code-review/examples/github_actions/ocr-review.yml
# (Apache-2.0). Changes vs upstream:
#   - action + CLI pinned to v1.12.9 (upstream example uses @main / latest)
#   - job skips cleanly until Scott configures the LLM secrets (upstream
#     assumes they exist)
#   - severity/category routing tuned for this repo (style+docs and
#     medium-and-below findings go to the summary, not inline)
#
# Required repo configuration (Settings -> Secrets and variables -> Actions):
#   secret OCR_LLM_URL          LLM API endpoint
#   secret OCR_LLM_AUTH_TOKEN   LLM auth token (mapped to OCR_LLM_TOKEN)
#   variable OCR_LLM_MODEL      model name
#   variable OCR_LLM_USE_ANTHROPIC  'true' for Anthropic, else OpenAI-compatible
name: OpenCodeReview PR Review

concurrency:
  group: >-
    ${{
      (
        github.event_name == 'pull_request_target'
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && (
            github.event.comment.author_association == 'MEMBER'
            || github.event.comment.author_association == 'OWNER'
            || github.event.comment.author_association == 'COLLABORATOR'
          )
          && (
            startsWith(github.event.comment.body, '/open-code-review')
            || startsWith(github.event.comment.body, '@open-code-review')
          )
        )
      )
      && format('ocr-{0}', github.event.pull_request.number || github.event.issue.number)
      || format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

on:
  # pull_request_target (not pull_request) so secrets are available even for
  # PRs from forks. Safe: the action only reads the diff, never executes PR code.
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Run on PR events, or on maintainer-authored comments starting with the
    # trigger keywords (on-demand re-review). Skip silently until the LLM
    # secrets are configured — see the notice step below.
    if: |
      github.event_name == 'pull_request_target'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && (
          github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
        && (
          startsWith(github.event.comment.body, '/open-code-review')
          || startsWith(github.event.comment.body, '@open-code-review')
        )
      )
    steps:
      - name: Check review prerequisites
        id: prereq
        run: |
          if [ -z "${{ secrets.OCR_LLM_URL }}" ] || \
             [ -z "${{ secrets.OCR_LLM_AUTH_TOKEN }}" ] || \
             [ -z "${{ vars.OCR_LLM_MODEL }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OpenCodeReview skipped: set OCR_LLM_URL / OCR_LLM_AUTH_TOKEN secrets and OCR_LLM_MODEL variable to enable PR reviews. See docs/CODE_REVIEW.md."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get PR context
        id: pr-context
        if: github.event_name == 'issue_comment' && steps.prereq.outputs.ready == 'true'
        uses: actions/github-script@v4
        with:
          script: |
            const prNumber = context.issue.number;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);

      - name: Run OpenCodeReview
        if: steps.prereq.outputs.ready == 'true'
        uses: alibaba/open-code-review@v1.12.9
        with:
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_use_anthropic: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
          ocr_version: '1.12.9'
          # For issue_comment triggers, pass the resolved refs; for
          # pull_request_target the action resolves them from the event.
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}
          sticky_summary: 'true'
          incremental: 'true'
          route_severity_below: 'medium'
          route_categories: 'style,documentation'
          upload_artifacts: 'true'
