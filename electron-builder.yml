appId: com.pdfezfill.desktop
productName: PdfEzFill
copyright: "Copyright © 2026 PdfEzFill"

directories:
  buildResources: assets
  output: release

files:
  - dist/**/*
  - assets/**/*
  - "!**/*.map"

# NOTE (system dependency): the processing pipeline shells out to
# `pdftoppm` from Poppler, which is NOT bundled with the app. Installers /
# release notes must tell users to install Poppler (macOS:
# `brew install poppler`; Debian/Ubuntu: `poppler-utils`). The server
# detects its absence at startup and reports it by name.
extraResources:
  - from: server/python
    to: python
    filter:
      - "*.py"
      - requirements.txt

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false

dmg:
  sign: false
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

publish:
  provider: github
  owner: smanthey
  repo: PdfEzFill
